<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels Studio — учёт клиентов и оплат</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1012;
    --surface: #17181C;
    --surface-2: #1E2024;
    --line: #2A2C31;
    --text: #F3F2ED;
    --text-muted: #8C8E96;
    --accent: #FF4D2E;        /* clapper red-orange — CTA, REC */
    --accent-dim: rgba(255,77,46,.14);
    --ok: #4ADE80;             /* остаток здоровый */
    --ok-dim: rgba(74,222,128,.14);
    --warn: #FBBF24;           /* остаток заканчивается */
    --warn-dim: rgba(251,191,36,.14);
    --danger: #FF5C6C;         /* остаток исчерпан / перерасход */
    --danger-dim: rgba(255,92,108,.14);
    --radius: 14px;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    overflow: hidden;
  }
  .app{ display:flex; height:100vh; }

  /* ---------- Sidebar (desktop) ---------- */
  .sidebar{
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    display:flex; flex-direction:column;
    padding: 20px 12px;
  }
  .brand{
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: .5px;
    padding: 6px 10px 20px;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 11px 12px; border-radius: 10px;
    color: var(--text-muted); font-weight:600; font-size:14px;
    cursor:pointer; margin-bottom:2px; user-select:none;
  }
  .nav-item svg{ width:18px; height:18px; opacity:.85; }
  .nav-item.active{ background: var(--surface-2); color: var(--text); }
  .nav-item.active svg{ opacity:1; }
  .nav-item:hover:not(.active){ background: rgba(255,255,255,.03); }
  .sidebar-footer{ margin-top:auto; padding:12px 10px; font-size:12px; color:var(--text-muted); border-top:1px solid var(--line); padding-top:14px;}

  /* ---------- Main column ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 24px; border-bottom:1px solid var(--line);
    background: var(--bg);
  }
  .topbar h1{ font-family:var(--font-display); font-size:22px; letter-spacing:.4px; font-weight:400;}
  .topbar .sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .fab{
    background: var(--accent); color:#1a0a05; border:none; border-radius: 10px;
    font-family: var(--font-body); font-weight:700; font-size:13.5px;
    padding: 10px 16px; cursor:pointer; display:flex; align-items:center; gap:6px;
    box-shadow: 0 4px 14px rgba(255,77,46,.28);
  }
  .fab:hover{ filter: brightness(1.06); }
  .content{ flex:1; overflow-y:auto; padding: 22px 24px 90px; }

  /* ---------- Film-strip decorative rule ---------- */
  .filmrule{
    height:10px; margin-bottom:18px;
    background-image: radial-gradient(circle, var(--line) 1.6px, transparent 1.6px);
    background-size: 14px 10px;
    background-position: 0 center;
    opacity:.7;
  }

  /* ---------- Cards / grid ---------- */
  .grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:14px; margin-bottom:22px; }
  .grid-3{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-bottom:18px; }
  @media (max-width:520px){ .grid-3{ grid-template-columns: 1fr; } }
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px;
  }
  .stat-card .label{ font-size:12px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .stat-card .value{ font-family:var(--font-mono); font-size:26px; font-weight:700; margin-top:8px; font-variant-numeric: tabular-nums; }
  .stat-card .delta{ font-size:12px; margin-top:6px; color: var(--ok); font-weight:600; }
  .stat-card .delta.neg{ color:var(--accent); }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:18px;
  }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .panel-head h3{ font-size:14.5px; font-weight:700; }
  .panel-head .hint{ font-size:12px; color:var(--text-muted); }

  /* chart */
  .chart{ display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:6px; }
  .chart .col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .chart .bar-wrap{ width:100%; height:104px; display:flex; align-items:flex-end; justify-content:center; }
  .chart .bar{ width:60%; border-radius:5px 5px 3px 3px; background: linear-gradient(180deg, var(--accent), #B8330F); min-height:4px; transition: height .5s ease; }
  .chart .m-label{ font-size:11px; color:var(--text-muted); font-weight:600; }
  .chart .m-value{ font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); }

  /* rank / list rows shared */
  .rank-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .rank-row:last-child{ border-bottom:none; }
  .rank-num{ font-family:var(--font-mono); color:var(--text-muted); font-size:12px; width:16px; }
  .avatar{
    width:34px; height:34px; border-radius:9px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
    flex-shrink:0; border:1px solid var(--line);
  }
  .rank-info{ flex:1; min-width:0; }
  .rank-info .name{ font-size:13.5px; font-weight:600; }
  .rank-info .meta{ font-size:11.5px; color:var(--text-muted); }
  .rank-amount{ font-family:var(--font-mono); font-weight:700; font-size:13.5px; }
  .bar-bg{ height:4px; border-radius:2px; background:var(--line); margin-top:6px; overflow:hidden; }
  .bar-fg{ height:100%; background:var(--accent); border-radius:2px; }

  /* balance badge — the core new concept */
  .balance{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-weight:700; font-size:13px; padding:5px 10px; border-radius:8px; white-space:nowrap; }
  .balance.ok{ background:var(--ok-dim); color:var(--ok); }
  .balance.warn{ background:var(--warn-dim); color:var(--warn); }
  .balance.danger{ background:var(--danger-dim); color:var(--danger); }
  .balance .n{ font-size:15px; }

  /* generic table/list rows */
  .row{
    display:flex; align-items:center; gap:12px; padding:13px 4px;
    border-bottom:1px solid var(--line); cursor:pointer;
  }
  .row:hover{ background: rgba(255,255,255,.02); }
  .row:last-child{ border-bottom:none; }
  .row .title{ font-size:14px; font-weight:600; }
  .row .subtitle{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .row .right{ margin-left:auto; text-align:right; flex-shrink:0; }
  .row .amount{ font-family:var(--font-mono); font-weight:700; font-size:14px; }

  .search{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-family:var(--font-body); font-size:13.5px; margin-bottom:14px;
  }
  .search::placeholder{ color:var(--text-muted); }
  .search:focus{ outline:none; border-color:var(--accent); }

  .manager-select{
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:4px 8px; color:var(--text-muted); font-family:var(--font-body); font-size:11px;
    cursor:pointer; max-width:120px;
  }
  .manager-select:focus{ outline:none; border-color:var(--accent); color:var(--text); }

  .row-no-manager{
    background: rgba(255,77,46,.08);
    border-left: 3px solid var(--accent);
    padding-left: 10px;
    margin-left: -4px;
  }
  .no-manager-badge{
    display:inline-block; font-size:10px; font-weight:800; color:var(--accent);
    background:var(--accent-dim); padding:2px 8px; border-radius:100px; margin-left:8px;
    vertical-align:middle; letter-spacing:.2px; text-transform:uppercase;
  }

  .confirm-btn{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; cursor:pointer;
    border:2px solid var(--line); background:transparent; color:transparent;
    display:flex; align-items:center; justify-content:center;
  }
  .confirm-btn:hover{ border-color:var(--ok); }
  .confirm-btn.confirmed{ background:var(--ok); border-color:var(--ok); color:#052e12; }

  .reel-group{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    margin-bottom:10px; overflow:hidden;
  }
  .reel-group summary{
    list-style:none; cursor:pointer; padding:12px 14px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; user-select:none;
  }
  .reel-group summary::-webkit-details-marker{ display:none; }
  .reel-group summary::before{
    content:'▸'; color:var(--text-muted); font-size:11px; margin-right:8px; transition:transform .15s;
  }
  .reel-group[open] summary::before{ transform:rotate(90deg); }
  .reel-group summary .pkg-title{ font-size:13.5px; font-weight:700; }
  .reel-group summary .pkg-meta{ font-size:11.5px; color:var(--text-muted); font-weight:600; margin-top:2px; }
  .reel-group summary .pkg-count{ font-family:var(--font-mono); font-size:12.5px; font-weight:700; color:var(--ok); flex-shrink:0; }
  .reel-group .reel-group-body{ border-top:1px solid var(--line); padding:2px 14px; }
  .reel-group .row{ padding:10px 0; }

  /* Таблица роликов (внутри пакета и в отчёте) */
  .reel-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .reel-table th{
    text-align:left; color:var(--text-muted); font-weight:700; font-size:10px;
    text-transform:uppercase; letter-spacing:.4px; padding:6px 8px; border-bottom:1px solid var(--line);
  }
  .reel-table th:last-child, .reel-table td:last-child{ text-align:right; }
  .reel-table td{ padding:8px; border-bottom:1px solid var(--line); }
  .reel-table tr:last-child td{ border-bottom:none; }
  .reel-table .rt-num{ font-family:var(--font-mono); color:var(--text-muted); width:30px; }
  .reel-table .rt-date{ color:var(--text-muted); white-space:nowrap; width:64px; }
  .reel-table .rt-price{ font-family:var(--font-mono); font-weight:700; white-space:nowrap; }
  .reel-tr.clickable{ cursor:pointer; }
  .reel-tr.clickable:hover td{ background:rgba(255,255,255,.03); }
  .reel-table-subtotal{ text-align:right; font-size:11.5px; font-weight:700; color:var(--ok); padding:8px 8px 2px; }
  .referral-row td{ background:rgba(74,222,128,.08); }
  .referral-row .rt-price{ color:var(--ok); font-weight:800; }

  /* Увеличенное окно отчёта */
  .sheet.sheet-report{ max-width:640px; }
  .report-section{ margin-bottom:18px; }
  .report-section-title{ font-size:13px; font-weight:700; margin-bottom:8px; }
  @media (min-width:860px){ .sheet.sheet-report{ max-width:680px; } }

  .alert-panel{ border:1px solid rgba(251,191,36,.3); background:var(--warn-dim); }
  .alert-panel h3{ color:var(--warn); }

  .last-update{ font-size:11.5px; margin-top:3px; display:flex; align-items:center; gap:5px; }
  .last-update .dot{ width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .last-update.fresh{ color:var(--text-muted); }
  .last-update.fresh .dot{ background:var(--ok); }
  .last-update.aging{ color:var(--warn); }
  .last-update.aging .dot{ background:var(--warn); }
  .last-update.stale{ color:var(--danger); }
  .last-update.stale .dot{ background:var(--danger); }

  /* ---------- Экран входа ---------- */
  #loginScreen{
    position:fixed; inset:0; z-index:1000; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:32px 26px;
  }
  .login-brand{
    font-family:var(--font-display); font-size:28px; letter-spacing:.5px;
    display:flex; align-items:center; gap:9px; justify-content:center; margin-bottom:6px;
  }
  .login-brand .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px var(--accent-dim); }
  .login-sub{ text-align:center; font-size:12.5px; color:var(--text-muted); margin-bottom:24px; }
  .login-error{ color:var(--danger); font-size:12.5px; text-align:center; margin-top:4px; min-height:16px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.show{ display:flex; }
  .sheet{
    background: var(--surface); width:100%; max-width:460px; border-radius:16px 16px 0 0;
    padding:20px 20px 24px; border:1px solid var(--line); border-bottom:none;
    max-height:86vh; overflow-y:auto;
  }
  @media (min-width:860px){
    .overlay{ align-items:center; }
    .sheet{ border-radius:16px; border-bottom:1px solid var(--line); }
  }
  .sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sheet-head h3{ font-size:16px; font-weight:700; }
  .close-x{ width:28px; height:28px; border-radius:8px; background:var(--surface-2); border:none; color:var(--text-muted); cursor:pointer; font-size:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    padding:11px 12px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .field-note{ font-size:11.5px; color:var(--text-muted); margin-top:5px; }
  .bulk-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .bulk-row input{
    background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    padding:10px 11px; color:var(--text); font-family:var(--font-body); font-size:13.5px;
  }
  .bulk-row input:focus{ outline:none; border-color:var(--accent); }
  .bulk-title{ flex:1; min-width:0; }
  .bulk-price{ width:110px; flex-shrink:0; }
  .bulk-remove{
    flex-shrink:0; width:34px; height:34px; border-radius:8px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--text-muted); cursor:pointer; font-size:14px;
  }
  .bulk-remove:hover{ color:var(--danger); border-color:var(--danger); }
  .btn-row{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:12px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; border:none;
    font-family:var(--font-body);
  }
  .btn-primary{ background:var(--accent); color:#1a0a05; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--line); }
  .btn-danger{ background:rgba(255,77,46,.1); color:var(--accent); border:1px solid rgba(255,77,46,.25); flex:0 0 auto; padding:12px 16px;}

  .quick-choice{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .qc-btn{
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:16px 8px;
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
  }
  .qc-btn:hover{ border-color:var(--accent); }
  .qc-btn svg{ width:22px; height:22px; color:var(--accent); }
  .qc-btn span{ font-size:12px; font-weight:600; }

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{ display:none; }

  /* ---------- Responsive: mobile / Telegram phone view ---------- */
  @media (max-width: 820px){
    .sidebar{ display:none; }
    .content{ padding: 16px 14px 90px; }
    .topbar{ padding:14px 16px; }
    .grid{ grid-template-columns: repeat(2,1fr); }
    .bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; height:64px;
      background: var(--surface); border-top:1px solid var(--line); z-index:20;
    }
    .bn-item{
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      color:var(--text-muted); font-size:10.5px; font-weight:600; cursor:pointer;
    }
    .bn-item svg{ width:20px; height:20px; }
    .bn-item.active{ color:var(--accent); }
    .fab span{ display:none; }
    .fab{ padding:11px; border-radius:12px; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand"><span class="dot"></span>REELS STUDIO</div>
    <div class="login-sub">Внутренний инструмент — вход только для команды</div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="field"><label>Пароль</label><input id="loginPass" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" id="loginBtn" style="width:100%;">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app">

  <!-- SIDEBAR (desktop / Telegram Desktop) -->
  <div class="sidebar">
    <div class="brand"><span class="dot"></span>REELS STUDIO</div>
    <div class="nav-item active" data-tab="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h4v8H3zM10 8h4v13h-4zM17 3h4v18h-4z"/></svg>
      Обзор
    </div>
    <div class="nav-item" data-tab="clients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Клиенты
    </div>
    <div class="nav-item" data-tab="payments">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><path d="M1 10h22"/></svg>
      Оплаты
    </div>
    <div class="nav-item" data-tab="reels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 9l5-3v12l-5-3"/></svg>
      Ролики
    </div>
    <div class="nav-item" data-tab="managers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Менеджеры
    </div>
    <div class="sidebar-footer">Reels Studio · v0.4<br>Прототип мини-аппа<br><a href="#" id="logoutLink" style="color:var(--accent); text-decoration:none;">Выйти</a></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">Обзор</h1>
        <div class="sub" id="pageSub">Ваша студия за июль</div>
      </div>
      <button class="fab" id="quickAddBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
        <span>Добавить</span>
      </button>
    </div>

    <div class="content" id="content"></div>
  </div>
</div>

<!-- bottom nav mobile -->
<div class="bottom-nav">
  <div class="bn-item active" data-tab="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h4v8H3zM10 8h4v13h-4zM17 3h4v18h-4z"/></svg>
    Обзор
  </div>
  <div class="bn-item" data-tab="clients">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
    Клиенты
  </div>
  <div class="bn-item" data-tab="payments">

/* ---------------- STATE (загружается из базы при старте) ----------------

const rowToClient = r => ({id:r.id, name:r.name, tag:r.tag, note:r.note, color:r.color, managerId:r.manager_id, confirmedDate:r.confirmed_date, basePrice:r.base_price, referrerId:r.referrer_id});
const rowToPayment = r => ({id:r.id, clientId:r.client_id, amount:r.amount, reelsCount:r.reels_count, date:r.date, comment:r.comment});

/* ---------------- HELPERS ---------------- */
const fmtMoney = n => '₽' + n.toLocaleString('ru-RU');
const clientById = id => clients.find(c => c.id === id);
const initials = name => name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

const monthNamesShort = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

function totalRevenue(){ return payments.reduce((s,p)=>s+p.amount,0); }
function revenueThisMonth(){
  const now = new Date();
  return payments.filter(p=>{ const d=new Date(p.date); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); })
    .reduce((s,p)=>s+p.amount,0);
}
function revenueLastMonth(){
  const now = new Date();
  let m = now.getMonth()-1, y = now.getFullYear(); if(m<0){m=11;y--;}
  return payments.filter(p=>{ const d=new Date(p.date); return d.getFullYear()===y && d.getMonth()===m; })
    .reduce((s,p)=>s+p.amount,0);
}
function clientTotalPaid(id){ return payments.filter(p=>p.clientId===id).reduce((s,p)=>s+p.amount,0); }
function clientReelsPurchased(id){ return payments.filter(p=>p.clientId===id).reduce((s,p)=>s+p.reelsCount,0); }
function clientReelsDone(id){ return reels.filter(r=>r.clientId===id).length; }
function clientBalance(id){ return clientReelsPurchased(id) - clientReelsDone(id); }

/* Средняя цена за ролик у клиента: сумма всех его оплат / кол-во купленных роликов.
   Используется как крайний запасной вариант, если у клиента ещё не проставлена
   базовая цена и у конкретного ролика тоже нет своей цены. */
function clientPricePerReel(id){
  const purchased = clientReelsPurchased(id);
  if(!purchased) return 0;
  return clientTotalPaid(id) / purchased;
}
/* Цена конкретного ролика — по приоритету:
   1) цена, проставленная именно у этого ролика
   2) базовая цена клиента (проставляется вручную в карточке клиента)
   3) средняя оценка по оплатам (запасной вариант, если ничего не указано) */
function hasValue(v){ return v !== null && v !== undefined && v !== ''; }
function reelEffectivePrice(r){
  if(hasValue(r.price)) return Number(r.price);
  const c = clientById(r.clientId);
  if(c && hasValue(c.basePrice)) return Number(c.basePrice);
  return clientPricePerReel(r.clientId);
}
function clientEarnedTotal(id){
  return reels.filter(r=>r.clientId===id).reduce((s,r)=>s+reelEffectivePrice(r),0);
}

/* ---------------- РЕФЕРАЛЬНАЯ СИСТЕМА ----------------
   referrerId клиента — кто его привёл. За каждый готовый ролик приведённого
   клиента реферер получает ₽100 — это либо уменьшает его долг, либо
   увеличивает его доступный бюджет (если долга уже нет). */
function referredClients(clientId){ return clients.filter(c=>c.referrerId===clientId); }
function referralReels(clientId){
  const ids = referredClients(clientId).map(c=>c.id);
  return reels.filter(r=>ids.includes(r.clientId));
}
function referralBonus(clientId){ return referralReels(clientId).length * 100; }

/* Чистый баланс клиента в деньгах: заработано минус оплачено минус реферальный бонус.
   Положительное значение — клиент должен, отрицательное — у него запас (заморожено). */
function clientNetOwed(id){
  return clientEarnedTotal(id) - clientTotalPaid(id) - referralBonus(id);
}
/* Долг клиента: если реально заработанная сумма (по цене каждого ролика —
   своя цена ролика, иначе базовая, иначе средняя оценка) больше, чем он
   заплатил и заработал реферальным бонусом — разница и есть долг. */
function clientDebt(id){
  return Math.max(clientNetOwed(id), 0);
}
function clientFrozenBudget(id){
  return Math.max(-clientNetOwed(id), 0);
}
function totalFrozenBudget(){
  return clients.reduce((s,c)=>s+clientFrozenBudget(c.id),0);
}
function reelsInMonth(monthOffset){
  const now = new Date();
  let m = now.getMonth()-monthOffset, y = now.getFullYear();
  while(m<0){m+=12;y--;}
  return reels.filter(r=>{const d=new Date(r.date); return d.getMonth()===m && d.getFullYear()===y;});
}
function earnedInMonth(monthOffset){
  return reelsInMonth(monthOffset).reduce((s,r)=>s+reelEffectivePrice(r),0);
}

/* ---------------- МЕНЕДЖЕРЫ ---------------- */
function managerById(id){ return managers.find(m=>m.id===id); }
function managerClients(managerId){ return clients.filter(c=>c.managerId===managerId); }
function managerReelsDoneInMonth(managerId, monthOffset){
  const clientIds = managerClients(managerId).map(c=>c.id);
  return reelsInMonth(monthOffset).filter(r=>clientIds.includes(r.clientId)).length;
}
function managerRevenueInMonth(managerId, monthOffset){
  return managerReelsDoneInMonth(managerId, monthOffset) * 100;
}
function monthOffsetLabel(offset){
  const now = new Date();
  let m = now.getMonth()-offset, y = now.getFullYear();

  return `${names[m]} ${y}`;
}
function monthOptionsHtml(selected){

/* ---------------- ПОДТВЕРЖДЕНИЕ АКТУАЛЬНОСТИ ---------------- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isConfirmedToday(c){ return c.confirmedDate === todayStr(); }
function confirmedInfo(c){

function clientLastReelDate(id){
  const cReels = reels.filter(r=>r.clientId===id);
  if(cReels.length===0) return null;
  return cReels.reduce((latest,r)=> new Date(r.date) > new Date(latest) ? r.date : latest, cReels[0].date);
}

/* Группировка роликов по "пакету оплаты": каждая оплата открывает пакет,
   в который попадают все ролики с датой ПОЗЖЕ этой оплаты и РАНЬШЕ следующей.
   Чисто для удобства просмотра — на подсчёты остатка/бюджета не влияет.
   desc=true (по умолчанию) — новые пакеты сверху (для карточки клиента).
   desc=false — по порядку от старых к новым (для отчёта). */
function groupReelsByPayment(clientId, desc=true){
  const cPayments = payments.filter(p=>p.clientId===clientId).sort((a,b)=> new Date(a.date)-new Date(b.date));
  const cReels = reels.filter(r=>r.clientId===clientId);
  const dir = desc ? -1 : 1;
  const groups = cPayments.map((p, idx) => {
    const start = new Date(p.date);
    const next = cPayments[idx+1];
    const end = next ? new Date(next.date) : null;
    const groupReels = cReels.filter(r=>{
      const d = new Date(r.date);
      return d >= start && (!end || d < end);
    }).sort((a,b)=> dir*(new Date(b.date)-new Date(a.date)));
    return {payment:p, reels:groupReels};
  });
  if(desc) groups.reverse(); // новые пакеты сверху

  const orphan = cPayments.length
    ? cReels.filter(r=> new Date(r.date) < new Date(cPayments[0].date))
    : cReels.slice();
  orphan.sort((a,b)=> dir*(new Date(b.date)-new Date(a.date)));

  return {groups, orphan};
}

/* Сквозная нумерация роликов клиента в хронологическом порядке (для отчёта и таблиц) */
function numberReelsForClient(clientId){
  const asc = reels.filter(r=>r.clientId===clientId).sort((a,b)=> new Date(a.date)-new Date(b.date) || a.id-b.id);
  const map = new Map();
  asc.forEach((r,i)=> map.set(r.id, i+1));
  return map;
}

/* Таблица роликов: № / название / дата / цена + подытог. clickable — делает строки
   кликабельными для редактирования (используется внутри рабочей карточки клиента,
   но не в чистом отчёте для клиента). */
function reelTableHtml(list, numberMap, clickable){
  if(list.length===0) return '<div style="color:var(--text-muted); font-size:12.5px; padding:10px 0;">Пока нет роликов</div>';
  let total = 0;
  const rows = list.map(r=>{
    const price = reelEffectivePrice(r);
    total += price;
    return `<tr class="reel-tr ${clickable?'clickable':''}" ${clickable?`data-client-reel="${r.id}"`:''}>
      <td class="rt-num">${numberMap.get(r.id) ?? ''}</td>
      <td class="rt-name">${r.note||'Без названия'}</td>
      <td class="rt-date">${formatDate(r.date)}</td>
      <td class="rt-price">${fmtMoney(Math.round(price))}</td>
    </tr>`;
  }).join('');
  return `<table class="reel-table"><thead><tr><th>№</th><th>Ролик</th><th>Дата</th><th>Цена</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="reel-table-subtotal">Итого: ${fmtMoney(Math.round(total))}</div>`;
}

const NOW = new Date();
function daysAgoLabel(dateStr){
  if(!dateStr) return {text:'ролики ещё не добавлялись', cls:'stale'};
  const d = new Date(dateStr);
  const diff = Math.round((NOW - d) / (1000*60*60*24));
  let text;
  if(diff<=0) text = 'сегодня';
  else if(diff===1) text = 'вчера';
  else text = `${diff} дн. назад`;
  const cls = diff>14 ? 'stale' : diff>7 ? 'aging' : 'fresh';
  return {text, cls};
}

function balanceClass(n){
  if(n<=0) return 'danger';
  if(n<=2) return 'warn';
  return 'ok';
}
function balanceBadge(n, debt){
  const cls = balanceClass(n);
  const label = n<0 ? `${n} (перерасход)` : n;
  const debtHtml = (n<0 && debt) ? `<span style="display:block; font-size:10px; font-weight:700; margin-top:2px;">должен ${fmtMoney(Math.round(debt))}</span>` : '';
  return `<span class="balance ${cls}" style="text-align:center;"><span class="n">${label}</span> ост.${debtHtml}</span>`;
}

/* Статус активности клиента по дате последнего ролика:
   зелёный (fresh) — активный, жёлтый (aging) — нет материалов давно,
   красный (stale) — клиент, похоже, ушёл (или ролика не было вообще) */
function clientActivity(id){
  const dateStr = clientLastReelDate(id);
  const lu = daysAgoLabel(dateStr);
  const diff = dateStr ? Math.round((NOW - new Date(dateStr)) / (1000*60*60*24)) : Infinity;
  const order = lu.cls==='fresh' ? 0 : lu.cls==='aging' ? 1 : 2;
  const statusLabel = lu.cls==='fresh' ? 'Активный клиент' : lu.cls==='aging' ? 'Нет материалов' : 'Клиент ушёл';
  return {cls:lu.cls, text:lu.text, diff, order, statusLabel};
}

function formatDate(d){
  const date = new Date(d);
  return date.getDate() + ' ' + monthNamesShort[date.getMonth()];
}

function managerSelectHtml(c, wide){

function referrerSelectHtml(c){

function referralBonusTableHtml(clientId){
  const refReels = referralReels(clientId).sort((a,b)=> new Date(a.date)-new Date(b.date));

function renderClients(){
  const activeCount = clients.filter(c=>clientActivity(c.id).cls==='fresh').length;

  const lostCount = clients.filter(c=>clientActivity(c.id).cls==='stale').length;
  const noManagerCount = clients.filter(c=>!c.managerId).length;

  const filtered = clients
    .filter(c => c.name.toLowerCase().includes(clientFilter.toLowerCase()) || c.tag.toLowerCase().includes(clientFilter.toLowerCase()))
    .map(c=>({...c, act: clientActivity(c.id)}))

        <div class="label">🔴 Похоже, ушли</div>
        <div class="value" style="color:var(--danger); font-size:22px;">${lostCount}</div>

/* ---------------- TAB SWITCH ---------------- */
const titles = {
  dashboard: ['Обзор', 'Ваша студия за июль'],
  clients: ['Клиенты', clients.length + ' активных клиентов'],
  payments: ['Оплаты', 'История всех поступлений'],
  reels: ['Ролики', 'Лог готовых роликов'],
  managers: ['Менеджеры', managers.length + ' менеджеров'],
};

function setTab(tab){
  activeTab = tab;
  document.querySelectorAll('.nav-item, .bn-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab===tab);
  });
  document.getElementById('pageTitle').textContent = titles[tab][0];
  document.getElementById('pageSub').textContent = titles[tab][1];
  render();
}

function openManager(id){
  activeTab = 'managerClients';
  selectedManagerId = id;
  selectedManagerMonthOffset = 0;
  document.querySelectorAll('.nav-item, .bn-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab==='managers');
  });
  const m = managerById(id);
  document.getElementById('pageTitle').textContent = m ? m.name : 'Менеджер';
  document.getElementById('pageSub').textContent = managerClients(id).length + ' клиентов';
  render();
}

function render(){
  const content = document.getElementById('content');
  if(activeTab==='dashboard') content.innerHTML = renderDashboard();
  if(activeTab==='clients') content.innerHTML = renderClients();
  if(activeTab==='payments') content.innerHTML = renderPayments();
  if(activeTab==='reels') content.innerHTML = renderReels();
  if(activeTab==='managers') content.innerHTML = renderManagers();
  if(activeTab==='managerClients') content.innerHTML = renderManagerClients(selectedManagerId);
  attachContentEvents();
}

function attachContentEvents(){
  const search = document.getElementById('clientSearch');
  if(search){
    search.addEventListener('input', e=>{ clientFilter = e.target.value; renderKeepFocus(); });
  }
  document.querySelectorAll('[data-client]').forEach(el=>{
    el.addEventListener('click', ()=> openClientDetail(parseInt(el.dataset.client)));
  });
  document.querySelectorAll('[data-payment]').forEach(el=>{
    el.addEventListener('click', ()=> openEditPayment(parseInt(el.dataset.payment)));
  });
  document.querySelectorAll('[data-reel]').forEach(el=>{
    el.addEventListener('click', ()=> openEditReel(parseInt(el.dataset.reel)));
  });
  document.querySelectorAll('[data-manager-client]').forEach(el=>{
    el.addEventListener('click', e=> e.stopPropagation());
    el.addEventListener('change', async e=>{
      e.stopPropagation();
      const clientId = parseInt(el.dataset.managerClient);
      const managerId = el.value ? parseInt(el.value) : null;
      const {error} = await db.from('clients').update({manager_id: managerId}).eq('id', clientId);
      if(error){ alert('Не удалось сохранить: '+error.message); return; }
      clientById(clientId).managerId = managerId;
      render();
    });
  });
  document.querySelectorAll('[data-manager]').forEach(el=>{
    el.addEventListener('click', ()=> openManager(parseInt(el.dataset.manager)));
  });
  document.querySelectorAll('[data-confirm-client]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.stopPropagation();
      toggleConfirm(parseInt(el.dataset.confirmClient));
    });
  });
  const addManagerBtn = document.getElementById('addManagerBtn');
  if(addManagerBtn) addManagerBtn.addEventListener('click', openAddManager);
  const backToManagers = document.getElementById('backToManagers');
  if(backToManagers) backToManagers.addEventListener('click', ()=> setTab('managers'));
  const managerMonthSelect = document.getElementById('managerMonthSelect');
  if(managerMonthSelect) managerMonthSelect.addEventListener('change', e=>{
    selectedManagerMonthOffset = parseInt(e.target.value);
    render();
  });
}

function renderKeepFocus(){
  const content = document.getElementById('content');
  content.innerHTML = renderClients();
  attachContentEvents();
  const s = document.getElementById('clientSearch');
  s.focus(); s.setSelectionRange(s.value.length, s.value.length);
}

function openAddReel(lockedClientId){
  let rows = [{title:'', price:''}];
  const today = new Date().toISOString().slice(0,10);
  const todayLabel = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  const lockedClient = lockedClientId ? clientById(lockedClientId) : null;

  function rowsHtml(){
    return rows.map((r,i)=>`
      <div class="bulk-row">
        <input class="bulk-title" data-idx="${i}" placeholder="Название ролика" value="${r.title.replace(/"/g,'&quot;')}">
        <input class="bulk-price" data-idx="${i}" type="number" placeholder="₽ за ролик" value="${r.price}">
        ${rows.length>1 ? `<button class="bulk-remove" data-idx="${i}" type="button">✕</button>` : ''}
      </div>`).join('');
  }

  function attachRowEvents(){
    document.querySelectorAll('.bulk-title').forEach(el=>{
      el.oninput = ()=>{ rows[+el.dataset.idx].title = el.value; };
    });
    document.querySelectorAll('.bulk-price').forEach(el=>{
      el.oninput = ()=>{ rows[+el.dataset.idx].price = el.value; updatePreview(); };
    });
    document.querySelectorAll('.bulk-remove').forEach(el=>{
      el.onclick = ()=>{ rows.splice(+el.dataset.idx,1); renderRows(); updatePreview(); };
    });
  }

  function renderRows(){
    document.getElementById('bulkRows').innerHTML = rowsHtml();
    attachRowEvents();
  }

  function currentClientId(){
    return lockedClientId || parseInt(select.value);
  }

  function updatePreview(){
    const clientId = currentClientId();
    const bal = clientBalance(clientId);
    const filled = rows.filter(r=>r.title.trim()!=='').length || rows.length;
    const newBal = bal - filled;
    preview.textContent = `Будет добавлено роликов: ${filled}. После этого остаток станет: ${newBal}`;
    preview.style.color = balanceClass(newBal)==='danger' ? 'var(--danger)' : balanceClass(newBal)==='warn' ? 'var(--warn)' : 'var(--text-muted)';
  }

  openSheet(`
    <div class="sheet-head"><h3>Готовые ролики</h3><button class="close-x" id="closeSheet">✕</button></div>
    ${lockedClient
      ? `<div class="field"><label>Клиент</label><div style="padding:11px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; font-size:14px;">${lockedClient.name}</div></div>`
      : `<div class="field"><label>Клиент</label><select id="fClient">${clientOptions()}</select></div>`}
    <div class="field-note" style="margin-bottom:14px;">Дата у всех — сегодня, ${todayLabel}</div>
    <div class="field"><label>Ролики (можно сразу несколько)</label></div>
    <div id="bulkRows">${rowsHtml()}</div>
    <button class="btn btn-ghost" id="addRowBtn" type="button" style="width:100%; margin-bottom:14px;">+ Добавить ещё строку</button>
    <div class="field-note" id="balancePreview" style="margin-bottom:14px;"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="closeSheet2">Отмена</button>
      <button class="btn btn-primary" id="saveReel">Отметить готовыми</button>
    </div>
  `);

  const select = document.getElementById('fClient');
  const preview = document.getElementById('balancePreview');
  attachRowEvents();
  if(select) select.addEventListener('change', updatePreview);
  document.getElementById('addRowBtn').addEventListener('click', ()=>{
    rows.push({title:'', price:''});
    renderRows();
    updatePreview();
  });
  updatePreview();

  document.getElementById('saveReel').onclick = async ()=>{
    const clientId = currentClientId();
    const valid = rows.filter(r=>r.title.trim()!=='');
    if(valid.length===0){ alert('Впишите хотя бы одно название ролика'); return; }
    const insertRows = valid.map(r=>({
      client_id: clientId,
      note: r.title.trim(),
      date: today,
      price: r.price!=='' ? parseFloat(r.price) : null,
    }));
    const btn = document.getElementById('saveReel'); btn.disabled = true; btn.textContent = 'Сохраняю...';
    let data, error;
    try{
      ({data, error} = await db.from('reels').insert(insertRows).select());
    }catch(e){
      alert('Не удалось сохранить: нет связи с сервером. Проверьте интернет и попробуйте ещё раз.');
      btn.disabled=false; btn.textContent='Отметить готовыми'; return;
    }
    if(error){ alert('Не удалось сохранить: '+error.message); btn.disabled=false; btn.textContent='Отметить готовыми'; return; }
    if(!data || data.length < insertRows.length){
      alert('Внимание: похоже, сохранились не все ролики. Проверьте список и добавьте недостающие.');
    }
    /* ДИАГНОСТИКА: сразу после вставки отдельным запросом (не из кэша) проверяем,
       что база реально отдаёт эти же строки обратно. Если insert вернул данные,
       а повторный select их не находит — проблема в правах на чтение (RLS SELECT),
       а не в самой записи. Если бы была проблема в записи — insert вернул бы error
       или пустой data, и мы бы это уже поймали выше. */
    const insertedIds = (data||[]).map(d=>d.id).filter(Boolean);
    if(insertedIds.length){
      const {data:checkData, error:checkError} = await db.from('reels').select('id').in('id', insertedIds);
      if(checkError){
        alert('ДИАГНОСТИКА: ролик(и) вставились, но повторный запрос на чтение вернул ошибку: '+checkError.message+'\n\nЭто повод проверить RLS-политику SELECT для таблицы reels в Supabase.');
      } else if(!checkData || checkData.length < insertedIds.length){
        alert('ДИАГНОСТИКА: ролик(и) записались в базу (insert прошёл успешно, id: '+insertedIds.join(', ')+'), но при немедленном повторном чтении найдено только '+(checkData?checkData.length:0)+' из '+insertedIds.length+'.\n\nЭто значит: проблема не в сохранении, а в праве на ЧТЕНИЕ (RLS SELECT policy) таблицы reels в Supabase — именно поэтому при обновлении страницы ролики "пропадают". Нужно открыть Supabase → Authentication → Policies → reels и сравнить политику SELECT с политикой INSERT.');
      }
    }
    (data||[]).forEach(d=>reels.push(rowToReel(d)));
    if(lockedClientId){ openClientDetail(lockedClientId); } else { closeSheet(); setTab('reels'); }
  };
}

/* ---------------- ЭКРАН ВХОДА ----------------
   Простая защита от случайных людей, перешедших по ссылке.
   Логин/пароль хранятся в этом файле открытым текстом — это не защита
   от того, кто умеет смотреть код страницы, а просто "закрытая дверь"
   для всех остальных. Реальная защита данных — это RLS в Supabase
   и то, что ссылку на бота вы никому не публикуете.
------------------------------------------------------------------ */
/* ---------------- ЭКРАН ВХОДА ----------------
   Настоящий вход через Supabase Auth: проверка происходит на стороне
   базы данных, а не в браузере. Пока человек не вошёл под одним из
   аккаунтов, созданных в Supabase (Authentication → Users), база
   отклоняет любые запросы — это уже не просто "закрытая дверь",
   а реальная защита на уровне сервера (RLS требует auth.role() = 'authenticated').
------------------------------------------------------------------ */
async function tryLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Проверяю...';
  const {data, error} = await db.auth.signInWithPassword({email, password: pass});
  btn.disabled = false; btn.textContent = 'Войти';
  if(error){
    err.textContent = 'Неверный email или пароль';
    return;
  }
  document.getElementById('loginScreen').style.display = 'none';
  loadAll();
}
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
document.getElementById('loginEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });

document.getElementById('logoutLink').addEventListener('click', async (e)=>{
  e.preventDefault();
  await db.auth.signOut();
  location.reload();
});

/* Если сессия уже сохранена в браузере (человек не выходил) — пускаем сразу */
(async ()=>{
  const {data:{session}} = await db.auth.getSession();
  if(session){
    document.getElementById('loginScreen').style.display = 'none';
    loadAll();
  }
})();
</script>
</body>
</html>
